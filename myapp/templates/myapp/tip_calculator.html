{% extends "base.html" %}
{% load static %}

{% block title %}Tip Calculator{% endblock %}

{% block content %}

<style>
  /* ================================
     Remove number input spinners
     ================================ */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type=number] {
    -moz-appearance: textfield; /* Firefox */
    background-color: #262626;
    border: 1px solid #525252;
    color: #ffffff;
  }

  input[type=number]:focus {
    outline: none;
    border-color: #7f1d1d;
    box-shadow: 0 0 0 2px rgba(127, 29, 29, 0.4);
  }
</style>

<div class="flex justify-center">
  <div class="w-full max-w-md border border-white/40 bg-black/40 backdrop-blur-sm rounded-lg p-6">

    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="font-benibuddy text-2xl tracking-widest text-white">Benihana</h1>
      <p class="text-sm text-gray-300">Tip-out calculator</p>
    </div>

    <!-- Form -->
    <div class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-4 items-center">

	    <!-- Teppan -->
	    <label for="teppan" class="text-right text-sm opacity-80">
		    Teppan
	    </label>
	    <div class="flex items-center gap-2">
		    <span class="opacity-70">$</span>
		    <input id="teppan" type="number"
				       class="w-full bg-neutral-800 border border-neutral-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-700"
				       value="0">
	    </div>

	    <!-- Sushi -->
	    <label for="sushi" class="text-right text-sm opacity-80">
		    Sushi
	    </label>
	    <div class="flex items-center gap-2">
		    <span class="opacity-70">$</span>
		    <input id="sushi" type="number"
				      class="w-full bg-neutral-800 border border-neutral-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-700"
				      value="0">
	    </div>

	    <!-- Bar -->
	    <label for="bar" class="text-right text-sm opacity-80">
		    Bar
	    </label>
	    <div class="flex items-center gap-2">
		    <span class="opacity-70">$</span>
		    <input id="bar" type="number"
				    class="w-full bg-neutral-800 border border-neutral-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-700"
				    value="0">
	    </div>

	    <!-- Tip -->
	    <label for="tip" class="text-right text-sm opacity-80">
		    Tip
	    </label>
	    <div class="flex items-center gap-2">
		    <span class="opacity-70">$</span>
		    <input id="tip" type="number"
				    class="w-full bg-neutral-800 border border-neutral-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-red-700"
				    placeholder="optional">
	    </div>

    </div>

    <!-- Buttons -->
    <div class="flex justify-center gap-4 mt-6">
	    <button
			    type="button"
			    onclick="calculate()"
			    class="px-4 py-2 rounded bg-primary text-white hover:opacity-90 transition"
			    >
			    Calculate
	    </button>

		    <button
				    type="button"
				    id="resetBtn"
				    class="px-4 py-2 rounded border border-white/40 text-white hover:bg-white/10 transition"
				    >
				    Reset
		    </button>
    </div>

      <!-- Breakdown -->
      <div class="mt-6 border border-white/40 rounded-lg p-4 bg-black/30">
        <h2 class="text-sm font-semibold text-gray-100 mb-3">Tip-Out Breakdown</h2>

        <div class="space-y-1 text-sm">
          <div class="flex justify-between"><span class="text-gray-200">Teppan:</span><span id="teppanOut" class="font-semibold transition-all duration-200">$0.00</span></div>
          <div class="flex justify-between"><span class="text-gray-200">Sushi:</span><span id="sushiOut" class="font-semibold transition-all duration-200">$0.00</span></div>
          <div class="flex justify-between"><span class="text-gray-200">Bar:</span><span id="barOut" class="font-semibold transition-all duration-200">$0.00</span></div>
          <div class="flex justify-between"><span class="text-gray-200">Busser:</span><span id="busserOut" class="font-semibold transition-all duration-200">$0.00</span></div>
        </div>

        <hr class="my-3 border-white/30">

        <div class="flex justify-between text-sm">
          <span class="text-gray-200">Total:</span>
          <span id="totalOut" class="font-semibold transition-all duration-200">$0.00</span>
        </div>

        <div id="netWrap" class="flex justify-between text-sm mt-2" style="display:none;">
          <span class="text-gray-200">Net Tips:</span>
          <span id="netTips" class="font-semibold text-red-300 transition-all duration-200">$0.00</span>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="{% static 'myapp/js/tip_calc.js' %}"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const resetBtn = document.getElementById("resetBtn");
    if (resetBtn) {
      resetBtn.addEventListener("click", () => {
        ["teppan","sushi","bar"].forEach(id => (document.getElementById(id).value = 0));
        document.getElementById("tip").value = "";
        if (typeof calculate === "function") calculate();
      });
    }
  });
</script>
{% endblock %}
